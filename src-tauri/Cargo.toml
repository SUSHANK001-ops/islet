[package]
name = "islet"
version = "0.2.0"
description = "Islet - a focus and study companion in a pill at the top of your screen."
edition = "2021"
rust-version = "1.77"

[lib]
name = "islet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon: built-in tray menu (Show/Hide, Settings, Quit). No extra crate.
# protocol-asset: lets the frontend read the active character's sheet PNG from
# app data via the asset: protocol (scoped to $APPDATA/characters in the conf).
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# time: correct local-date filenames for the daily activity log. Date math by
# hand (leap years, timezones, DST) is error-prone; `time` is small + standard.
time = { version = "0.3", features = ["local-offset", "formatting", "macros"] }
# global-shortcut: OS-level hotkey that fires when Islet is NOT focused.
# Reimplementing means Win32 RegisterHotKey + conflict handling; official+small.
tauri-plugin-global-shortcut = "2"
# autostart: writes the Windows "run at login" entry correctly across install
# types. Rolling our own risks registry mistakes; official + small.
tauri-plugin-autostart = "2"
# notification: Windows toast on focus round end. Hand-rolling WinRT toast XML
# is far more than 100 lines and fragile; official + small.
tauri-plugin-notification = "2"
# opener: launch an external URL (YouTube Music) in the user's default browser.
# Official + small; avoids shelling out and handles the OS launch correctly.
tauri-plugin-opener = "2"
# dialog: native file picker for importing a character pack (.islet-char) and,
# in Spec 9, adding a launcher app. The picker IS the user's consent; reusing
# the OS dialog is safer and smaller than a custom file browser.
tauri-plugin-dialog = "2"
# zip: pack a character folder into one shareable .islet-char file and unpack it
# on import. Reading/writing the ZIP container correctly (local headers, central
# directory, CRCs) is well over 100 lines and error-prone by hand; `zip` is the
# standard, widely-used crate. No compression needed, but it handles the format.
zip = { version = "2", default-features = false, features = ["deflate"] }
# Spec 13 character catalog (downloads). All three are security-critical and
# cannot be safely hand-rolled:
#  - ureq: a small, blocking HTTPS client (rustls). We only ever GET from ONE
#    allow-listed host; no cookies, no redirects off-host. Smaller than reqwest.
#  - ed25519-dalek: verify the catalog index signature against a built-in public
#    key. Rolling Ed25519 by hand is a security non-starter.
#  - sha2: SHA-256 hash check of each downloaded pack vs the signed index.
ureq = { version = "2", default-features = false, features = ["tls"] }
ed25519-dalek = "2"
sha2 = "0.10"

# Windows-only APIs for fullscreen / foreground-window detection (platform/).
[target.'cfg(windows)'.dependencies]
# Pinned to 0.62 to match the version Tauri's dependency tree already compiles,
# so there is a single consistent windows-core (avoids trait-version clashes).
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
  "Win32_System_RemoteDesktop",
  "Win32_System_Power",
  "Win32_System_LibraryLoader",
  # Spec 10: hide-from-capture + taskbar progress (ITaskbarList3 via COM).
  "Win32_UI_Shell",
  "Win32_System_Com",
  # Spec 11: Core Audio (volume/mute/device), power status, settings props.
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_SystemInformation",
  "Win32_Devices_FunctionDiscovery",
  "Win32_UI_Shell_PropertiesSystem",
  # Spec 11: Wi-Fi/Bluetooth radios (WinRT).
  "Devices_Radios",
  # SMTC "now playing" + transport controls (Spec 5 media).
  "Media_Control",
  "Foundation",
  "Foundation_Collections",
] }

[profile.release]
# Bundle rule: small, no bloat. Strip symbols, optimize for size, LTO on.
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
