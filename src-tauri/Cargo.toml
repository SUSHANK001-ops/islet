[package]
name = "islet"
version = "0.0.0"
description = "Islet - a focus and study companion in a pill at the top of your screen."
edition = "2021"
rust-version = "1.77"

[lib]
name = "islet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon: built-in tray menu (Show/Hide, Settings, Quit). No extra crate.
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# time: correct local-date filenames for the daily activity log. Date math by
# hand (leap years, timezones, DST) is error-prone; `time` is small + standard.
time = { version = "0.3", features = ["local-offset", "formatting", "macros"] }
# global-shortcut: OS-level hotkey that fires when Islet is NOT focused.
# Reimplementing means Win32 RegisterHotKey + conflict handling; official+small.
tauri-plugin-global-shortcut = "2"
# autostart: writes the Windows "run at login" entry correctly across install
# types. Rolling our own risks registry mistakes; official + small.
tauri-plugin-autostart = "2"

# Windows-only APIs for fullscreen / foreground-window detection (platform/).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
] }

[profile.release]
# Bundle rule: small, no bloat. Strip symbols, optimize for size, LTO on.
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
